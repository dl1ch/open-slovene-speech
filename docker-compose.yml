# The light stack: official containers do all the heavy lifting; the only custom
# piece is a tiny phonemizer proxy. Fetch the models first: scripts/fetch-models.sh
#
#   docker compose up -d                 Home Assistant stack (STT + TTS, Wyoming)
#   docker compose --profile openai up   OpenAI-compatible all-in-one (Open WebUI)
services:

  # ── Speech to text ─ official container, our model mounted. No custom code. ──
  whisper:
    image: rhasspy/wyoming-whisper
    command: >
      --model /models/slovene-whisper-ct2 --language sl
      --data-dir /data --uri tcp://0.0.0.0:10300
    volumes:
      - ./models/slovene-whisper-ct2:/models/slovene-whisper-ct2:ro
      - whisper-data:/data
    ports: ["10300:10300"]
    restart: unless-stopped

  # ── TTS synthesis ─ official piper, our voice in raw-phoneme (espeak) mode. ──
  piper:
    image: rhasspy/wyoming-piper
    command: >
      --voice sl_SI-artur-medium --data-dir /voice --uri tcp://0.0.0.0:10200
    volumes:
      - ./models/piper-voice:/voice:ro
    restart: unless-stopped

  # ── TTS phonemization ─ the one custom piece. Lexicon → [[raw]] → piper. ──
  tts:
    build: { context: ., dockerfile: Dockerfile.proxy }
    command: --uri tcp://0.0.0.0:10200 --piper-uri tcp://piper:10200
    volumes:
      - ./models/slovene-voice/lexicon:/lexicon:ro
    ports: ["10200:10200"]
    depends_on: [piper]
    restart: unless-stopped

  # ── Optional: OpenAI-compatible all-in-one for Open WebUI / LibreChat. ──
  # A single self-contained server (our onnxruntime synth + faster-whisper).
  # Heavier, but one container and speaks /v1/audio/*.
  openai:
    profiles: ["openai"]
    build: { context: ., dockerfile: Dockerfile }
    volumes: ["./models:/models:ro"]
    ports: ["8080:8080"]
    restart: unless-stopped

volumes:
  whisper-data:
