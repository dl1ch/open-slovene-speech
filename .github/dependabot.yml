# Dependabot version updates.
#
# Alerts and automated security fixes are enabled in the repository settings;
# this file is the separate, scheduled check for ordinary version bumps.
#
# Deliberately quiet: this project's dependencies are few and stable, and a
# stream of patch-bump PRs on a model release nobody is actively developing is
# noise. Minor and patch updates are grouped into one PR per ecosystem; major
# versions come through on their own, because for onnxruntime and
# faster-whisper a major bump is a real compatibility question, not a bump.
version: 2
updates:
  # /tts declares MINIMUMS for a library people install into their own
  # environment. Raising a floor there updates nobody -- pip already resolves
  # to the newest compatible release -- it only excludes users on older
  # Pythons. A bump to onnxruntime>=1.31.1 would have excluded Python 3.9,
  # where this bundle is verified working. So version updates are off here;
  # security updates still apply, and that is the case where a floor earns its
  # cost.
  - package-ecosystem: pip
    directory: /tts
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels: ["dependencies"]

  # /serve is the container's stack and is pinned by requirements.lock, so
  # bumps here are safe to take.
  - package-ecosystem: pip
    directory: /serve
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      serving:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies"]

  # The Dockerfile's base is behind `ARG BASE=python:3.11-slim`. Dependabot may
  # not resolve a templated FROM; if no PRs ever appear here, that is why, and
  # the base image needs bumping by hand.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: ["dependencies"]
